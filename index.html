<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Chrono Track</title>
    <style>
        :root {
            --bg-color: #0a0a12;
            --panel-bg: rgba(20, 20, 35, 0.6);
            --accent-primary: #00f2fe;
            --accent-secondary: #4facfe;
            --text-main: #ffffff;
            --text-sub: #707593;
            --shadow-color: rgba(0, 242, 254, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--shadow-color);
        }

        .period-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, var(--text-main), var(--text-sub));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .time-range {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        /* 外周の進捗リング */
        .progress-container {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 35px;
        }

        .progress-svg {
            transform: rotate(-90deg);
            width: 240px;
            height: 240px;
        }

        .progress-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.03);
            stroke-width: 8;
        }

        .progress-bar {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        .time-left {
            font-size: 3rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            line-height: 1;
        }

        .time-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 8px;
        }

        /* 下部のタイムライン */
        .timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .timeline-item {
            font-size: 0.75rem;
            color: var(--text-sub);
            transition: all 0.3s ease;
        }

        .timeline-item.active {
            color: var(--accent-primary);
            text-shadow: 0 0 8px var(--shadow-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge" id="status-badge">STANDBY</div>
        <div class="period-title" id="period-name">授業外</div>
        <div class="time-range" id="time-range">--:-- - --:--</div>

        <div class="progress-container">
            <svg class="progress-svg">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="var(--accent-secondary)" />
                        <stop offset="100%" stop-color="var(--accent-primary)" />
                    </linearGradient>
                </defs>
                <circle class="progress-bg" cx="120" cy="120" r="110"></circle>
                <circle class="progress-bar" id="progress-bar" cx="120" cy="120" r="110"></circle>
            </svg>
            <div class="timer-display">
                <div class="time-left" id="time-left">00:00</div>
                <div class="time-label" id="time-label">REMAINING</div>
            </div>
        </div>

        <div class="timeline" id="timeline">
            </div>
    </div>

    <script>
        // 時間割データの定義 (24時間表記の分換算で管理)
        function toMin(hh, mm) { return hh * 60 + mm; }
        
        const schedule = [
            { name: "1限", start: toMin(8,40), end: toMin(9,25), type: "class" },
            { name: "休み時間", start: toMin(9,25), end: toMin(9,35), type: "break" },
            { name: "2限", start: toMin(9,35), end: toMin(10,20), type: "class" },
            { name: "休み時間", start: toMin(10,20), end: toMin(10,30), type: "break" },
            { name: "3限", start: toMin(10,30), end: toMin(11,15), type: "class" },
            { name: "休み時間", start: toMin(11,15), end: toMin(11,25), type: "break" },
            { name: "4限", start: toMin(11,25), end: toMin(12,10), type: "class" },
            { name: "昼休み", start: toMin(12,10), end: toMin(12,50), type: "break" },
            { name: "予鈴", start: toMin(12,50), end: toMin(12,55), type: "warning" },
            { name: "5限", start: toMin(12,55), end: toMin(13,40), type: "class" },
            { name: "休み時間", start: toMin(13,40), end: toMin(13,50), type: "break" },
            { name: "6限", start: toMin(13,50), end: toMin(14,35), type: "class" },
            { name: "休み時間", start: toMin(14,35), end: toMin(14,45), type: "break" },
            { name: "7限", start: toMin(14,45), end: toMin(15,30), type: "class" }
        ];

        // 円形プログレスバーの設定
        const circle = document.getElementById('progress-bar');
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        circle.style.strokeDasharray = `${circumference} ${circumference}`;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        function formatTime(min) {
            const h = Math.floor(min / 60).toString().padStart(2, '0');
            const m = (min % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        // 下部タイムラインの一覧生成
        const timelineEl = document.getElementById('timeline');
        schedule.filter(s => s.type === "class").forEach(s => {
            const item = document.createElement('div');
            item.className = 'timeline-item';
            item.id = `tl-${s.name}`;
            item.innerText = s.name;
            timelineEl.appendChild(item);
        });

        function updateTimer() {
            const now = new Date();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const currentSec = now.getSeconds();
            const totalCurrentSeconds = currentMin * 60 + currentSec;

            let currentPeriod = null;

            // 現在の時間がどのコマに属しているか探す
            for (let i = 0; i < schedule.length; i++) {
                if (currentMin >= schedule[i].start && currentMin < schedule[i].end) {
                    currentPeriod = schedule[i];
                    break;
                }
            }

            const badge = document.getElementById('status-badge');
            const periodName = document.getElementById('period-name');
            const timeRange = document.getElementById('time-range');
            const timeLeft = document.getElementById('time-left');

            // アクティブな時間割のUIハイライトをリセット
            document.querySelectorAll('.timeline-item').forEach(el => el.classList.remove('active'));

            if (currentPeriod) {
                // ハイライト処理
                if (currentPeriod.type === "class") {
                    const tlItem = document.getElementById(`tl-${currentPeriod.name}`);
                    if (tlItem) tlItem.classList.add('active');
                }

                // バッジのテキストと色を変更
                if (currentPeriod.type === "class") {
                    badge.innerText = "ON DUTY";
                    badge.style.borderColor = "#00f2fe";
                    badge.style.color = "#00f2fe";
                    badge.style.background = "rgba(0, 242, 254, 0.1)";
                } else if (currentPeriod.type === "warning") {
                    badge.innerText = "PREPARE";
                    badge.style.borderColor = "#ff9f43";
                    badge.style.color = "#ff9f43";
                    badge.style.background = "rgba(255, 159, 67, 0.1)";
                } else {
                    badge.innerText = "BREAK TIME";
                    badge.style.borderColor = "#10ac84";
                    badge.style.color = "#10ac84";
                    badge.style.background = "rgba(16, 172, 132, 0.1)";
                }

                periodName.innerText = currentPeriod.name;
                timeRange.innerText = `${formatTime(currentPeriod.start)} - ${formatTime(currentPeriod.end)}`;

                // 残り時間の計算（秒単位で精密に）
                const totalPeriodSeconds = (currentPeriod.end - currentPeriod.start) * 60;
                const elapsedSeconds = totalCurrentSeconds - (currentPeriod.start * 60);
                const remainingSeconds = totalPeriodSeconds - elapsedSeconds;

                const displayMin = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
                const displaySec = (remainingSeconds % 60).toString().padStart(2, '0');
                timeLeft.innerText = `${displayMin}:${displaySec}`;

                // 進捗リングの更新（残り時間が減るにつれてリングが短くなる）
                const percent = (remainingSeconds / totalPeriodSeconds) * 100;
                setProgress(percent);

            } else {
                // 放課後・授業外の時間
                badge.innerText = "OFF DUTY";
                badge.style.borderColor = var(--text-sub);
                badge.style.color = var(--text-sub);
                badge.style.background = "transparent";
                
                periodName.innerText = "授業時間外";
                timeRange.innerText = "--:-- - --:--";
                timeLeft.innerText = "00:00";
                setProgress(0);
            }
        }

        // 1秒ごとに更新
        setInterval(updateTimer, 1000);
        updateTimer(); // 初回起動
    </script>
</body>
</html>
