<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono OS - Class Nexus</title>
    <style>
        :root {
            --bg-color: #05050d;
            --panel-bg: rgba(10, 10, 25, 0.7);
            --accent-class: #00f2fe;
            --accent-break: #00ff87;
            --accent-warning: #ff3838;
            --text-main: #ffffff;
            --text-sub: #616e88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景のアニメーション・サイバーグリッド */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
            z-index: 1;
        }

        body::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(0, 255, 135, 0.05) 30%, transparent 60%);
            animation: rotateBg 20s linear infinite;
            z-index: 2;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* メインコンテナ */
        .container {
            width: 92%;
            max-width: 480px;
            background: var(--panel-bg);
            padding: 45px 35px;
            border-radius: 16px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 242, 254, 0.15);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 242, 254, 0.05);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* SF風のコーナー装飾 */
        .container::before, .container::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-class);
        }
        .container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .container::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* ステータスバッジ */
        .status-wrapper {
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 18px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 3px;
            border-radius: 4px;
            transition: all 0.5s ease;
            border: 1px solid var(--text-sub);
            color: var(--text-sub);
        }

        /* 各種モードのネオンカラー定義 */
        .mode-class {
            color: var(--accent-class) !important;
            border-color: var(--accent-class) !important;
            background: rgba(0, 242, 254, 0.05);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }
        .mode-break {
            color: var(--accent-break) !important;
            border-color: var(--accent-break) !important;
            background: rgba(0, 255, 135, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.2);
        }
        .mode-warning {
            color: var(--accent-warning) !important;
            border-color: var(--accent-warning) !important;
            background: rgba(ff, 56, 56, 0.05);
            box-shadow: 0 0 15px rgba(255, 56, 56, 0.2);
        }

        .period-title {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .time-range {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        /* 中央サークルタイマー */
        .progress-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 35px;
        }

        .progress-svg {
            transform: rotate(-90deg);
            width: 260px;
            height: 260px;
        }

        .progress-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.02);
            stroke-width: 6;
        }

        .progress-bar {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s linear, stroke 0.5s ease;
            filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.5));
        }

        .timer-display {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        .time-left {
            font-size: 3.5rem;
            font-weight: 100;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            line-height: 1;
        }

        .time-label {
            font-size: 0.7rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 12px;
        }

        /* 下部タイムライン */
        .timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-top: 10px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .timeline-item {
            font-size: 0.7rem;
            color: var(--text-sub);
            position: relative;
            padding-bottom: 5px;
            transition: all 0.5s ease;
        }

        .timeline-item.active {
            color: #ffffff;
            font-weight: bold;
        }

        .timeline-item::after {
            content: "";
            position: absolute;
            bottom: 0; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--text-sub);
            transition: all 0.5s ease;
        }

        .timeline-item.active::after {
            background: var(--accent-class);
            box-shadow: 0 0 10px var(--accent-class);
            width: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-wrapper">
            <div class="status-badge" id="status-badge">SYSTEM STANDBY</div>
        </div>
        <div class="period-title" id="period-name">LOADING</div>
        <div class="time-range" id="time-range">00:00 - 00:00</div>

        <div class="progress-container">
            <svg class="progress-svg">
                <circle class="progress-bg" cx="130" cy="130" r="120"></circle>
                <circle class="progress-bar" id="progress-bar" cx="130" cy="130" r="120"></circle>
            </svg>
            <div class="timer-display">
                <div class="time-left" id="time-left">00:00</div>
                <div class="time-label" id="time-label">CHRONO INDEX</div>
            </div>
        </div>

        <div class="timeline" id="timeline">
            </div>
    </div>

    <script>
        function toMin(hh, mm) { return hh * 60 + mm; }
        
        // 時間割データ
        const schedule = [
            { name: "1限", start: toMin(8,40), end: toMin(9,25), type: "class" },
            { name: "休み時間", start: toMin(9,25), end: toMin(9,35), type: "break" },
            { name: "2限", start: toMin(9,35), end: toMin(10,20), type: "class" },
            { name: "休み時間", start: toMin(10,20), end: toMin(10,30), type: "break" },
            { name: "3限", start: toMin(10,30), end: toMin(11,15), type: "class" },
            { name: "休み時間", start: toMin(11,15), end: toMin(11,25), type: "break" },
            { name: "4限", start: toMin(11,25), end: toMin(12,10), type: "class" },
            { name: "昼休み", start: toMin(12,10), end: toMin(12,50), type: "break" },
            { name: "予鈴", start: toMin(12,50), end: toMin(12,55), type: "warning" },
            { name: "5限", start: toMin(12,55), end: toMin(13,40), type: "class" },
            { name: "休み時間", start: toMin(13,40), end: toMin(13,50), type: "break" },
            { name: "6限", start: toMin(13,50), end: toMin(14,35), type: "class" },
            { name: "休み時間", start: toMin(14,35), end: toMin(14,45), type: "break" },
            { name: "7限", start: toMin(14,45), end: toMin(15,30), type: "class" }
        ];

        const circle = document.getElementById('progress-bar');
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        circle.style.strokeDasharray = `${circumference} ${circumference}`;

        function setProgress(percent, color) {
            const offset = circumference - (percent / 100) * circumference;
            circle.style.strokeDashoffset = offset;
            circle.style.stroke = color;
        }

        function formatTime(min) {
            const h = Math.floor(min / 60).toString().padStart(2, '0');
            const m = (min % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        // 下部タイムライン（授業のみ）の生成
        const timelineEl = document.getElementById('timeline');
        schedule.filter(s => s.type === "class").forEach(s => {
            const item = document.createElement('div');
            item.className = 'timeline-item';
            item.id = `tl-${s.name}`;
            item.innerText = s.name;
            timelineEl.appendChild(item);
        });

        function updateTimer() {
            const now = new Date();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const currentSec = now.getSeconds();
            const totalCurrentSeconds = currentMin * 60 + currentSec;

            let currentPeriod = null;

            for (let i = 0; i < schedule.length; i++) {
                if (currentMin >= schedule[i].start && currentMin < schedule[i].end) {
                    currentPeriod = schedule[i];
                    break;
                }
            }

            const badge = document.getElementById('status-badge');
            const periodName = document.getElementById('period-name');
            const timeRange = document.getElementById('time-range');
            const timeLeft = document.getElementById('time-left');

            document.querySelectorAll('.timeline-item').forEach(el => el.classList.remove('active'));

            if (currentPeriod) {
                if (currentPeriod.type === "class") {
                    const tlItem = document.getElementById(`tl-${currentPeriod.name}`);
                    if (tlItem) tlItem.classList.add('active');
                }

                // クラスのリセットと付与
                badge.className = "status-badge";
                let activeColor = "#616e88";

                if (currentPeriod.type === "class") {
                    badge.innerText = "ACTIVE CLASS";
                    badge.classList.add("mode-class");
                    activeColor = "#00f2fe";
                } else if (currentPeriod.type === "warning") {
                    badge.innerText = "PRE-ALERT";
                    badge.classList.add("mode-warning");
                    activeColor = "#ff3838";
                } else {
                    badge.innerText = "INTERMISSION";
                    badge.classList.add("mode-break");
                    activeColor = "#00ff87";
                }

                periodName.innerText = currentPeriod.name;
                timeRange.innerText = `${formatTime(currentPeriod.start)} - ${formatTime(currentPeriod.end)}`;

                // 残り時間の秒単位計算
                const totalPeriodSeconds = (currentPeriod.end - currentPeriod.start) * 60;
                const elapsedSeconds = totalCurrentSeconds - (currentPeriod.start * 60);
                const remainingSeconds = totalPeriodSeconds - elapsedSeconds;

                const displayMin = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
                const displaySec = (remainingSeconds % 60).toString().padStart(2, '0');
                timeLeft.innerText = `${displayMin}:${displaySec}`;

                const percent = (remainingSeconds / totalPeriodSeconds) * 100;
                setProgress(percent, activeColor);

            } else {
                badge.className = "status-badge";
                badge.innerText = "OFF LINE";
                periodName.innerText = "授業時間外";
                timeRange.innerText = "--:-- - --:--";
                timeLeft.innerText = "00:00";
                setProgress(0, "#616e88");
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
