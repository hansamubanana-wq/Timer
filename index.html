<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONO MATRIX v3.5</title>
    <style>
        :root {
            --bg-color: #020206;
            --panel-bg: rgba(6, 6, 14, 0.8);
            --accent-class: #00f2fe;
            --accent-break: #39ff14;
            --accent-warning: #ff0055;
            --text-main: #ffffff;
            --text-sub: #414d66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* サイバー背景 */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.015) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center;
            z-index: 1;
        }

        /* 4角のシャープなフレーム装飾 */
        .frame-corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid var(--accent-class);
            z-index: 5;
            opacity: 0.4;
            transition: border-color 0.5s;
        }
        .top-left { top: 25px; left: 25px; border-right: none; border-bottom: none; }
        .top-right { top: 25px; right: 25px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 25px; left: 25px; border-right: none; border-top: none; }
        .bottom-right { bottom: 25px; right: 25px; border-left: none; border-top: none; }

        /* メインコックピットパネル */
        .core-panel {
            width: 95%;
            max-width: 440px;
            background: var(--panel-bg);
            padding: 45px 35px 40px;
            border-radius: 20px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.8),
                inset 0 0 40px rgba(0, 242, 254, 0.03);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* スキャンライン */
        .core-panel::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px;
            opacity: 0.3;
            border-radius: 20px;
            pointer-events: none;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-sub);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .glitch-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 6px;
            animation: textPulse 4s infinite alternate;
        }

        @keyframes textPulse {
            0% { text-shadow: 0 0 8px rgba(255,255,255,0.1); }
            100% { text-shadow: 0 0 15px rgba(255,255,255,0.3); }
        }

        .time-range {
            font-size: 0.85rem;
            color: var(--text-sub);
            letter-spacing: 5px;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        /* 中央の円形クロノメーター */
        .chrono-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 40px;
        }

        .chrono-svg {
            transform: rotate(-90deg);
            width: 260px;
            height: 260px;
        }

        .chrono-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.02);
            stroke-width: 8;
        }

        /* 内側のドット目盛り */
        .chrono-ticks {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 2;
            stroke-dasharray: 2 12;
        }

        .chrono-bar {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s linear, stroke 0.5s ease;
        }

        /* メーター先端を追従する光のドット */
        .orbit-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            top: 130px;
            left: 130px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: transform 0.3s linear, background 0.5s, box-shadow 0.5s;
            z-index: 2;
        }

        .timer-display {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        .time-left {
            font-size: 4.2rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            line-height: 1;
        }

        .time-label {
            font-size: 0.65rem;
            color: var(--text-sub);
            letter-spacing: 6px;
            margin-top: 8px;
        }

        /* 下部タイムライン */
        .timeline-box {
            position: relative;
            padding-top: 20px;
            border-top: 1px rgba(255, 255, 255, 0.05) solid;
        }

        .rail {
            position: relative;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 15px;
        }

        .rail-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 0%;
            transition: width 0.3s linear, background 0.5s;
        }

        .labels-grid {
            display: flex;
            justify-content: space-between;
        }

        .label-node {
            font-size: 0.7rem;
            color: var(--text-sub);
            transition: all 0.5s ease;
        }

        .label-node.active {
            color: #ffffff;
            font-weight: bold;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <div class="frame-corner top-left" id="c-tl"></div>
    <div class="frame-corner top-right" id="c-tr"></div>
    <div class="frame-corner bottom-left" id="c-bl"></div>
    <div class="frame-corner bottom-right" id="c-br"></div>

    <div class="core-panel">
        <div class="panel-header">
            <div id="status-node">NODE // STANDBY</div>
            <div>INDEX v3.5</div>
        </div>

        <div class="glitch-title" id="period-name">--------</div>
        <div class="time-range" id="time-range">00:00 // 00:00</div>

        <div class="chrono-container">
            <svg class="chrono-svg">
                <circle class="chrono-bg" cx="130" cy="130" r="116"></circle>
                <circle class="chrono-ticks" cx="130" cy="130" r="106"></circle>
                <circle class="chrono-bar" id="chrono-bar" cx="130" cy="130" r="116"></circle>
            </svg>
            <div class="orbit-dot" id="orbit-dot"></div>
            <div class="timer-display">
                <div class="time-left" id="time-left">00:00</div>
                <div class="time-label">REMAINING</div>
            </div>
        </div>

        <div class="timeline-box">
            <div class="rail">
                <div class="rail-fill" id="rail-fill"></div>
            </div>
            <div class="labels-grid" id="labels-grid">
                </div>
        </div>
    </div>

    <script>
        function toMin(hh, mm) { return hh * 60 + mm; }
        
        const schedule = [
            { name: "1限", start: toMin(8,40), end: toMin(9,25), type: "class" },
            { name: "休み時間", start: toMin(9,25), end: toMin(9,35), type: "break" },
            { name: "2限", start: toMin(9,35), end: toMin(10,20), type: "class" },
            { name: "休み時間", start: toMin(10,20), end: toMin(10,30), type: "break" },
            { name: "3限", start: toMin(10,30), end: toMin(11,15), type: "class" },
            { name: "休み時間", start: toMin(11,15), end: toMin(11,25), type: "break" },
            { name: "4限", start: toMin(11,25), end: toMin(12,10), type: "class" },
            { name: "昼休み", start: toMin(12,10), end: toMin(12,50), type: "break" },
            { name: "予鈴", start: toMin(12,50), end: toMin(12,55), type: "warning" },
            { name: "5限", start: toMin(12,55), end: toMin(13,40), type: "class" },
            { name: "休み時間", start: toMin(13,40), end: toMin(13,50), type: "break" },
            { name: "6限", start: toMin(13,50), end: toMin(14,35), type: "class" },
            { name: "休み時間", start: toMin(14,35), end: toMin(14,45), type: "break" },
            { name: "7限", start: toMin(14,45), end: toMin(15,30), type: "class" }
        ];

        const bar = document.getElementById('chrono-bar');
        const radius = bar.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        bar.style.strokeDasharray = `${circumference} ${circumference}`;

        // 下部ラベル生成
        const grid = document.getElementById('labels-grid');
        schedule.filter(s => s.type === "class").forEach(s => {
            const node = document.createElement('div');
            node.className = 'label-node';
            node.id = `node-${s.name}`;
            node.innerText = s.name;
            grid.appendChild(node);
        });

        function formatTime(min) {
            return `${Math.floor(min / 60).toString().padStart(2, '0')}:${(min % 60).toString().padStart(2, '0')}`;
        }

        function updateChronoDeck() {
            const now = new Date();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const currentSec = now.getSeconds();
            const totalCurrentSeconds = currentMin * 60 + currentSec;

            let currentPeriod = null;
            for (let i = 0; i < schedule.length; i++) {
                if (currentMin >= schedule[i].start && currentMin < schedule[i].end) {
                    currentPeriod = schedule[i];
                    break;
                }
            }

            const statusNode = document.getElementById('status-node');
            const periodName = document.getElementById('period-name');
            const timeRange = document.getElementById('time-range');
            const timeLeft = document.getElementById('time-left');
            const railFill = document.getElementById('rail-fill');
            const orbitDot = document.getElementById('orbit-dot');

            document.querySelectorAll('.label-node').forEach(el => el.classList.remove('active'));

            if (currentPeriod) {
                if (currentPeriod.type === "class") {
                    const activeNode = document.getElementById(`node-${currentPeriod.name}`);
                    if (activeNode) activeNode.classList.add('active');
                }

                let themeColor = "var(--text-sub)";
                if (currentPeriod.type === "class") {
                    statusNode.innerText = "MODE // CLASS_ACTIVE";
                    themeColor = "var(--accent-class)";
                } else if (currentPeriod.type === "warning") {
                    statusNode.innerText = "MODE // PRE_ALERT";
                    themeColor = "var(--accent-warning)";
                } else {
                    statusNode.innerText = "MODE // INTERMISSION";
                    themeColor = "var(--accent-break)";
                }

                // コーナーフレームの色も連動
                document.querySelectorAll('.frame-corner').forEach(el => el.style.borderColor = themeColor);

                periodName.innerText = currentPeriod.name;
                periodName.style.color = themeColor;
                timeRange.innerText = `${formatTime(currentPeriod.start)} // ${formatTime(currentPeriod.end)}`;

                const totalPeriodSeconds = (currentPeriod.end - currentPeriod.start) * 60;
                const elapsedSeconds = totalCurrentSeconds - (currentPeriod.start * 60);
                const remainingSeconds = totalPeriodSeconds - elapsedSeconds;

                const m = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
                const s = (remainingSeconds % 60).toString().padStart(2, '0');
                timeLeft.innerText = `${m}:${s}`;

                const percent = (remainingSeconds / totalPeriodSeconds) * 100;
                
                // 円形バーの更新
                const offset = circumference - (percent / 100) * circumference;
                bar.style.strokeDashoffset = offset;
                bar.style.stroke = themeColor;
                bar.style.filter = `drop-shadow(0 0 12px ${themeColor})`;

                // 先端ドットの位置計算 (角度に変換)
                const angle = (percent / 100) * 360 - 90; 
                const angleRad = (angle * Math.PI) / 180;
                const dotX = Math.cos(angleRad) * radius;
                const dotY = Math.sin(angleRad) * radius;
                orbitDot.style.transform = `translate(calc(-50% + ${dotX}px), calc(-50% + ${dotY}px))`;
                orbitDot.style.background = "#ffffff";
                orbitDot.style.boxShadow = `0 0 12px #ffffff, 0 0 20px ${themeColor}`;

                // 下部直線バーの更新
                railFill.style.width = `${100 - percent}%`;
                railFill.style.background = themeColor;
                railFill.style.boxShadow = `0 0 8px ${themeColor}`;

            } else {
                statusNode.innerText = "MODE // OFFLINE";
                document.querySelectorAll('.frame-corner').forEach(el => el.style.borderColor = "var(--text-sub)");
                periodName.innerText = "OFF LINE";
                periodName.style.color = "var(--text-sub)";
                timeRange.innerText = "--:-- // --:--";
                timeLeft.innerText = "00:00";
                
                bar.style.strokeDashoffset = circumference;
                orbitDot.style.transform = "translate(-50%, -50%)";
                orbitDot.style.boxShadow = "none";
                orbitDot.style.background = "transparent";
                railFill.style.width = "0%";
            }
        }

        setInterval(updateChronoDeck, 1000);
        updateChronoDeck();
    </script>
</body>
</html>
