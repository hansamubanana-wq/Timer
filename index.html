<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CHRONO MATRIX - COGNITIVE OS</title>
    <style>
        :root {
            --bg-color: #020206;
            --panel-bg: rgba(6, 6, 14, 0.85);
            --accent-class: #00f2fe;
            --accent-break: #39ff14;
            --accent-warning: #ff0055;
            --accent-voice: #bd00ff;
            --text-main: #ffffff;
            --text-sub: #414d66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            overscroll-behavior: none;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.015) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center;
            z-index: 1;
        }

        .frame-corner {
            position: absolute;
            width: 4vmin;
            height: 4vmin;
            min-width: 16px;
            min-height: 16px;
            border: 2px solid var(--accent-class);
            z-index: 5;
            opacity: 0.4;
            transition: border-color 0.5s;
        }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        .core-panel {
            width: 90vw;
            max-width: 440px;
            height: auto;
            max-height: 95vh;
            background: var(--panel-bg);
            padding: 5vmin 5vmin 4vmin;
            border-radius: 20px;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 3vmin;
            letter-spacing: 2px;
        }

        .glitch-title {
            font-size: clamp(2rem, 8vw, 2.8rem);
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 6px;
        }

        .time-range {
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            color: var(--text-sub);
            letter-spacing: 4px;
            margin-bottom: 4vmin;
            text-transform: uppercase;
        }

        .chrono-container {
            position: relative;
            width: clamp(160px, 45vw, 210px);
            height: clamp(160px, 45vw, 210px);
            margin: 0 auto 4vmin;
            flex-shrink: 0;
        }

        .chrono-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .chrono-bg { fill: none; stroke: rgba(255, 255, 255, 0.02); stroke-width: 8; }
        .chrono-ticks { fill: none; stroke: rgba(255, 255, 255, 0.05); stroke-width: 2; stroke-dasharray: 2 12; }
        .chrono-bar { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.3s linear, stroke 0.5s ease; }

        .orbit-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: transform 0.3s linear;
            z-index: 2;
        }

        .timer-display {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }

        .time-left {
            font-size: clamp(2.2rem, 10vw, 3.5rem);
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            line-height: 1;
        }

        .time-label {
            font-size: 0.6rem;
            color: var(--text-sub);
            letter-spacing: 5px;
            margin-top: 4px;
        }

        /* リアルタイム文字起こしログエリア */
        .transcript-container {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 4vmin;
            user-select: text;
            -webkit-user-select: text;
        }

        .transcript-text {
            font-size: 0.8rem;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.7);
            word-break: break-all;
        }

        .transcript-text .interim {
            color: var(--text-sub);
            font-style: italic;
        }

        /* 音声認識中のアニメーションバッジ */
        .voice-pulse {
            animation: v-pulse 1.5s infinite alternate;
        }
        @keyframes v-pulse {
            0% { text-shadow: 0 0 4px var(--accent-voice); opacity: 0.6; }
            100% { text-shadow: 0 0 12px var(--accent-voice); opacity: 1; }
        }

        .timeline-box {
            position: relative;
            padding-top: 2vmin;
            border-top: 1px rgba(255, 255, 255, 0.05) solid;
            flex-shrink: 0;
        }

        .rail { position: relative; width: 100%; height: 2px; background: rgba(255, 255, 255, 0.03); margin-bottom: 2vmin; }
        .rail-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; transition: width 0.3s linear, background 0.5s; }
        .labels-grid { display: flex; justify-content: space-between; }
        .label-node { font-size: clamp(0.6rem, 2.5vw, 0.75rem); color: var(--text-sub); transition: all 0.5s ease; }
        .label-node.active { color: #ffffff; font-weight: bold; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <div class="frame-corner top-left"></div>
    <div class="frame-corner top-right"></div>
    <div class="frame-corner bottom-left"></div>
    <div class="frame-corner bottom-right"></div>

    <div class="core-panel" id="main-panel">
        <div class="panel-header">
            <div id="status-node">TAP TO START AUDIO //</div>
            <div id="voice-status">MIC: OFF</div>
        </div>

        <div class="glitch-title" id="period-name">--------</div>
        <div class="time-range" id="time-range">00:00 // 00:00</div>

        <div class="chrono-container">
            <svg class="chrono-svg" viewBox="0 0 260 260">
                <circle class="chrono-bg" cx="130" cy="130" r="116"></circle>
                <circle class="chrono-ticks" cx="130" cy="130" r="106"></circle>
                <circle class="chrono-bar" id="chrono-bar" cx="130" cy="130" r="116"></circle>
            </svg>
            <div class="orbit-dot" id="orbit-dot"></div>
            <div class="timer-display">
                <div class="time-left" id="time-left">00:00</div>
                <div class="time-label">REMAINING</div>
            </div>
        </div>

        <div class="transcript-container" id="log-container">
            <div class="transcript-text" id="transcript-output">画面をタップしてマイクを許可すると、ここにリアルタイムで文字起こしが表示されます...</div>
        </div>

        <div class="timeline-box">
            <div class="rail">
                <div class="rail-fill" id="rail-fill"></div>
            </div>
            <div class="labels-grid" id="labels-grid"></div>
        </div>
    </div>

    <script>
        // ズームブロック処理
        document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', e => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);

        // 時間割
        function toMin(hh, mm) { return hh * 60 + mm; }
        const schedule = [
            { name: "1限", start: toMin(8,40), end: toMin(9,25), type: "class" },
            { name: "休み時間", start: toMin(9,25), end: toMin(9,35), type: "break" },
            { name: "2限", start: toMin(9,35), end: toMin(10,20), type: "class" },
            { name: "休み時間", start: toMin(10,20), end: toMin(10,30), type: "break" },
            { name: "3限", start: toMin(10,30), end: toMin(11,15), type: "class" },
            { name: "休み時間", start: toMin(11,15), end: toMin(11,25), type: "break" },
            { name: "4限", start: toMin(11,25), end: toMin(12,10), type: "class" },
            { name: "昼休み", start: toMin(12,10), end: toMin(12,50), type: "break" },
            { name: "予鈴", start: toMin(12,50), end: toMin(12,55), type: "warning" },
            { name: "5限", start: toMin(12,55), end: toMin(13,40), type: "class" },
            { name: "休み時間", start: toMin(13,40), end: toMin(13,50), type: "break" },
            { name: "6限", start: toMin(13,50), end: toMin(14,35), type: "class" },
            { name: "休み時間", start: toMin(14,35), end: toMin(14,45), type: "break" },
            { name: "7限", start: toMin(14,45), end: toMin(15,30), type: "class" }
        ];

        const bar = document.getElementById('chrono-bar');
        const radius = 116;
        const circumference = radius * 2 * Math.PI;
        bar.style.strokeDasharray = `${circumference} ${circumference}`;

        const grid = document.getElementById('labels-grid');
        schedule.filter(s => s.type === "class").forEach(s => {
            const node = document.createElement('div');
            node.className = 'label-node';
            node.id = `node-${s.name}`;
            node.innerText = s.name;
            grid.appendChild(node);
        });

        function formatTime(min) {
            return `${Math.floor(min / 60).toString().padStart(2, '0')}:${(min % 60).toString().padStart(2, '0')}`;
        }

        function updateChronoDeck() {
            const now = new Date();
            const currentMin = now.getHours() * 60 + now.getMinutes();
            const currentSec = now.getSeconds();
            const totalCurrentSeconds = currentMin * 60 + currentSec;

            let currentPeriod = null;
            for (let i = 0; i < schedule.length; i++) {
                if (currentMin >= schedule[i].start && currentMin < schedule[i].end) {
                    currentPeriod = schedule[i];
                    break;
                }
            }

            const statusNode = document.getElementById('status-node');
            const periodName = document.getElementById('period-name');
            const timeRange = document.getElementById('time-range');
            const timeLeft = document.getElementById('time-left');
            const railFill = document.getElementById('rail-fill');
            const orbitDot = document.getElementById('orbit-dot');

            document.querySelectorAll('.label-node').forEach(el => el.classList.remove('active'));

            if (currentPeriod) {
                if (currentPeriod.type === "class") {
                    const activeNode = document.getElementById(`node-${currentPeriod.name}`);
                    if (activeNode) activeNode.classList.add('active');
                }

                let themeColor = "var(--text-sub)";
                if (currentPeriod.type === "class") {
                    if(!micActive) statusNode.innerText = "MODE // CLASS_ACTIVE";
                    themeColor = "var(--accent-class)";
                } else if (currentPeriod.type === "warning") {
                    if(!micActive) statusNode.innerText = "MODE // PRE_ALERT";
                    themeColor = "var(--accent-warning)";
                } else {
                    if(!micActive) statusNode.innerText = "MODE // INTERMISSION";
                    themeColor = "var(--accent-break)";
                }

                if(!micActive) document.querySelectorAll('.frame-corner').forEach(el => el.style.borderColor = themeColor);

                periodName.innerText = currentPeriod.name;
                periodName.style.color = themeColor;
                timeRange.innerText = `${formatTime(currentPeriod.start)} // ${formatTime(currentPeriod.end)}`;

                const totalPeriodSeconds = (currentPeriod.end - currentPeriod.start) * 60;
                const elapsedSeconds = totalCurrentSeconds - (currentPeriod.start * 60);
                const remainingSeconds = totalPeriodSeconds - elapsedSeconds;

                const m = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
                const s = (remainingSeconds % 60).toString().padStart(2, '0');
                timeLeft.innerText = `${m}:${s}`;

                const percent = (remainingSeconds / totalPeriodSeconds) * 100;
                
                bar.style.strokeDashoffset = circumference - (percent / 100) * circumference;
                bar.style.stroke = themeColor;
                bar.style.filter = `drop-shadow(0 0 12px ${themeColor})`;

                const angle = (percent / 100) * 360 - 90; 
                const angleRad = (angle * Math.PI) / 180;
                const dotX = Math.cos(angleRad) * radius;
                const dotY = Math.sin(angleRad) * radius;
                
                const containerWidth = document.querySelector('.chrono-container').offsetWidth;
                const scale = containerWidth / 260;
                orbitDot.style.transform = `translate(calc(-50% + ${dotX * scale}px), calc(-50% + ${dotY * scale}px))`;
                
                orbitDot.style.background = "#ffffff";
                orbitDot.style.boxShadow = `0 0 12px #ffffff, 0 0 20px ${themeColor}`;

                railFill.style.width = `${100 - percent}%`;
                railFill.style.background = themeColor;
                railFill.style.boxShadow = `0 0 8px ${themeColor}`;

            } else {
                if(!micActive) statusNode.innerText = "MODE // OFFLINE";
                if(!micActive) document.querySelectorAll('.frame-corner').forEach(el => el.style.borderColor = "var(--text-sub)");
                periodName.innerText = "OFF LINE";
                periodName.style.color = "var(--text-sub)";
                timeRange.innerText = "--:-- // --:--";
                timeLeft.innerText = "00:00";
                
                bar.style.strokeDashoffset = circumference;
                orbitDot.style.transform = "translate(-50%, -50%)";
                orbitDot.style.boxShadow = "none";
                orbitDot.style.background = "transparent";
                railFill.style.width = "0%";
            }
        }

        // --- 音声認識システム (Web Speech API) ---
        let micActive = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let finalTranscript = ""; 

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true; // 連続認識
            recognition.interimResults = true; // 途中の経過も取得
            recognition.lang = 'ja-JP';

            recognition.onstart = () => {
                micActive = true;
                document.getElementById('voice-status').innerText = "MIC: REC";
                document.getElementById('voice-status').style.color = "var(--accent-voice)";
                document.getElementById('voice-status').classList.add('voice-pulse');
                document.getElementById('status-node').innerText = "SYSTEM // VOICE_RECORDING";
                document.getElementById('status-node').style.color = "var(--accent-voice)";
                document.querySelectorAll('.frame-corner').forEach(el => el.style.borderColor = "var(--accent-voice)");
            };

            recognition.onend = () => {
                // 授業中に途切れても自動で再起動させて永続化する
                if (micActive) {
                    recognition.start();
                } else {
                    document.getElementById('voice-status').innerText = "MIC: OFF";
                    document.getElementById('voice-status').style.color = "var(--text-sub)";
                    document.getElementById('voice-status').classList.remove('voice-pulse');
                    updateChronoDeck();
                }
            };

            recognition.onresult = (event) => {
                let interimTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + "<br>";
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                const outputEl = document.getElementById('transcript-output');
                outputEl.innerHTML = finalTranscript + '<span class="interim">' + interimTranscript + '</span>';
                
                // 自動スクロール
                const container = document.getElementById('log-container');
                container.scrollTop = container.scrollHeight;
            };
        } else {
            document.getElementById('transcript-output').innerText = "エラー: お使いのブラウザは音声認識に対応していません。";
        }

        // パネルタップで音声認識のON/OFFを切り替え
        document.getElementById('main-panel').addEventListener('click', () => {
            if (!recognition) return;
            if (!micActive) {
                document.getElementById('transcript-output').innerHTML = "音声の解析を開始します...<br>";
                recognition.start();
            }
        });

        setInterval(updateChronoDeck, 1000);
        updateChronoDeck();
        window.addEventListener('resize', updateChronoDeck);
    </script>
</body>
</html>
